[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merchantguard-ai"
version = "1.0.0"
description = "Synthetic payment-risk platform: data engineering, ML, drift monitoring and human-reviewed agent triage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2", "fastapi>=0.105,<1", "uvicorn>=0.25,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.25"]
dashboard = ["streamlit>=1.30", "plotly>=5.15"]

[project.scripts]
merchantguard = "merchantguard.cli:main"

[tool.setuptools.packages.find]
include = ["merchantguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
